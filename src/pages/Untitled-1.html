<!DOCTYPE html>
<html>
<head>
  <title>Shopify Product Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 20px;
      margin-bottom: 20px;
    }

    pre {
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 15px;
      border-radius: 5px;
      max-height: 800px;
      overflow: auto;
    }
  </style>
</head>
<body>

<button onclick="loadProducts()">Load Products</button>

<pre id="output"></pre>

<script>
async function loadProducts() {

  const query = `
  {
    products(first: 100) {
      edges {
        node {
          id
          title
          handle
          description
          productType
          vendor
          tags
          availableForSale

          featuredImage {
            url
            altText
          }

          priceRange {
            minVariantPrice {
              amount
              currencyCode
            }
          }

          collections(first: 20) {
            edges {
              node {
                title
                handle
              }
            }
          }

          variants(first: 50) {
            edges {
              node {
                title
                availableForSale
                price {
                  amount
                  currencyCode
                }
              }
            }
          }
        }
      }
    }
  }`;

  const response = await fetch(
    "https://qsccb0-xv.myshopify.com/api/2025-04/graphql.json",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Shopify-Storefront-Access-Token": "8b09e4bf0c667bee3f44411832ccd90c"
      },
      body: JSON.stringify({ query })
    }
  );

  const data = await response.json();

  const products = data.data.products.edges.map(({ node }) => ({
    title: node.title,
    handle: node.handle,
    productType: node.productType,
    price: node.priceRange.minVariantPrice.amount,
    available: node.availableForSale,
    image: node.featuredImage?.url,
    collections: node.collections.edges.map(c => c.node.title),
    variants: node.variants.edges.map(v => v.node.title)
  }));

  document.getElementById("output").textContent =
    JSON.stringify(products, null, 2);

  console.table(products);
}
</script>

</body>
</html>
